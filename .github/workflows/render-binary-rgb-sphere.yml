name: Render Binary RGB Sphere

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # =======================================
      # 1. Checkout
      # =======================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =======================================
      # 2. Install dependencies
      # =======================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            ffmpeg \
            unzip \
            curl \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libglu1-mesa \
            mesa-utils \
            libxrandr2 \
            libxi6 \
            libxrender1 \
            libxtst6

      # =======================================
      # 3. Download Processing
      # =======================================
      - name: Download Processing 4.5.6
        run: |
          curl -fL \
            "https://github.com/processing/processing4/releases/download/processing-1434-4.5.6/processing-4.5.6-linux-x64-portable.zip" \
            -o /tmp/processing.zip

          echo "Downloaded Processing:"
          ls -lh /tmp/processing.zip

          unzip -q /tmp/processing.zip -d /tmp/processing

          PROCESSING_BIN="/tmp/processing/Processing/bin/Processing"

          if [ ! -f "$PROCESSING_BIN" ]; then
            echo "ERROR: Processing executable not found:"
            echo "$PROCESSING_BIN"
            find /tmp/processing -maxdepth 5 -type f | head -100
            exit 1
          fi

          chmod +x "$PROCESSING_BIN"

          echo "PROCESSING_BIN=$PROCESSING_BIN" >> "$GITHUB_ENV"

          echo "Processing executable found:"
          ls -lh "$PROCESSING_BIN"

      # =======================================
      # 4. Test Processing CLI
      # =======================================
      - name: Test Processing CLI
        run: |
          "$PROCESSING_BIN" cli --help

      # =======================================
      # 5. Verify PDE file
      # =======================================
      - name: Verify sketch
        run: |
          echo "Checking animation files..."

          find animation -maxdepth 4 -type f || true

          SOURCE="animation/BinaryRGBSphere/BinaryRGBSphere.pde"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Sketch not found:"
            echo "$SOURCE"
            exit 1
          fi

          echo "Sketch found:"
          ls -lh "$SOURCE"

      # =======================================
      # 6. Prepare temporary sketch
      # =======================================
      - name: Prepare Processing sketch
        run: |
          SKETCH_DIR="/tmp/BinaryRGBSphere"

          rm -rf "$SKETCH_DIR"
          mkdir -p "$SKETCH_DIR/data"

          cp \
            "animation/BinaryRGBSphere/BinaryRGBSphere.pde" \
            "$SKETCH_DIR/BinaryRGBSphere.pde"

          # Enable rendering only in CI copy
          sed -i \
            's/boolean recording = false;/boolean recording = true;/' \
            "$SKETCH_DIR/BinaryRGBSphere.pde"

          # Close Processing when frame rendering finishes
          sed -i \
            's/stop();/exit();/g' \
            "$SKETCH_DIR/BinaryRGBSphere.pde"

          echo "SKETCH_DIR=$SKETCH_DIR" >> "$GITHUB_ENV"

          echo "Prepared sketch:"
          ls -la "$SKETCH_DIR"

          echo "Recording state:"
          grep "boolean recording" "$SKETCH_DIR/BinaryRGBSphere.pde"

      # =======================================
      # 7. Test software OpenGL
      # =======================================
      - name: Test virtual OpenGL display
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a \
            -s "-screen 0 1024x768x24" \
            glxinfo -B

      # =======================================
      # 8. Render transparent PNG frames
      # =======================================
      - name: Render transparent PNG frames
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p /tmp/processing-build

          echo "Starting Processing render..."

          xvfb-run -a \
            -s "-screen 0 1024x768x24" \
            "$PROCESSING_BIN" cli \
              --force \
              --sketch="$SKETCH_DIR" \
              --output="/tmp/processing-build" \
              --run

          echo "Processing render completed."

          FRAME_COUNT="$(find "$SKETCH_DIR/data" -maxdepth 1 -name 'fr*.png' | wc -l)"

          echo "Frames generated: $FRAME_COUNT"

          find "$SKETCH_DIR/data" \
            -maxdepth 1 \
            -name 'fr*.png' \
            | sort \
            | head -10

          if [ "$FRAME_COUNT" -lt 330 ]; then
            echo "ERROR: Expected 330 frames but found $FRAME_COUNT."
            exit 1
          fi

      # =======================================
      # 9. Create animated WebP
      # =======================================
      - name: Create transparent animated WebP
        run: |
          mkdir -p assets

          ffmpeg -y \
            -framerate 30 \
            -start_number 1 \
            -i "$SKETCH_DIR/data/fr%03d.png" \
            -vf "scale=420:420:flags=lanczos" \
            -c:v libwebp_anim \
            -q:v 82 \
            -compression_level 6 \
            -loop 0 \
            -pix_fmt yuva420p \
            -an \
            "assets/binary-rgb-sphere.webp"

          echo "Generated animation:"
          ls -lh assets/binary-rgb-sphere.webp

      # =======================================
      # 10. Upload Action artifact
      # =======================================
      - name: Upload animation artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-rgb-sphere
          path: assets/binary-rgb-sphere.webp
          if-no-files-found: error

      # =======================================
      # 11. Commit generated animation
      # =======================================
      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/binary-rgb-sphere.webp

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Render Binary RGB Sphere"
          git push
