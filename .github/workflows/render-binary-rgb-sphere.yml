name: Render Binary RGB Sphere

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            ffmpeg \
            unzip \
            curl \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libglu1-mesa \
            mesa-utils \
            libxrandr2 \
            libxi6 \
            libxrender1 \
            libxtst6

      - name: Download Processing 4.5.6
        run: |
          curl -fL \
            "https://github.com/processing/processing4/releases/download/processing-1434-4.5.6/processing-4.5.6-linux-x64-portable.zip" \
            -o /tmp/processing.zip

          unzip -q /tmp/processing.zip -d /tmp/processing

          PROCESSING_BIN="/tmp/processing/Processing/bin/Processing"

          if [ ! -f "$PROCESSING_BIN" ]; then
            echo "Processing executable not found: $PROCESSING_BIN"
            exit 1
          fi

          chmod +x "$PROCESSING_BIN"
          echo "PROCESSING_BIN=$PROCESSING_BIN" >> "$GITHUB_ENV"

      - name: Test Processing CLI
        run: |
          "$PROCESSING_BIN" cli --help

      - name: Verify sketch
        run: |
          SOURCE="animation/BinaryRGBSphere/BinaryRGBSphere.pde"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: $SOURCE not found."
            find . -maxdepth 5 -type f | sort | head -150
            exit 1
          fi

          ls -lh "$SOURCE"

      - name: Prepare Processing sketch
        run: |
          SKETCH_DIR="/tmp/BinaryRGBSphere"

          rm -rf "$SKETCH_DIR"
          mkdir -p "$SKETCH_DIR/data"

          cp \
            "animation/BinaryRGBSphere/BinaryRGBSphere.pde" \
            "$SKETCH_DIR/BinaryRGBSphere.pde"

          sed -i \
            's/boolean recording = false;/boolean recording = true;/' \
            "$SKETCH_DIR/BinaryRGBSphere.pde"

          sed -i \
            's/stop();/exit();/g' \
            "$SKETCH_DIR/BinaryRGBSphere.pde"

          echo "SKETCH_DIR=$SKETCH_DIR" >> "$GITHUB_ENV"

      - name: Test virtual OpenGL display
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a \
            -s "-screen 0 1024x768x24" \
            glxinfo -B

      - name: Render PNG frames
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p /tmp/processing-build

          xvfb-run -a \
            -s "-screen 0 1024x768x24" \
            "$PROCESSING_BIN" cli \
              --force \
              --sketch="$SKETCH_DIR" \
              --output="/tmp/processing-build" \
              --run

          FRAME_COUNT="$(find "$SKETCH_DIR/data" -maxdepth 1 -name 'fr*.png' | wc -l)"
          echo "Frames generated: $FRAME_COUNT"

          if [ "$FRAME_COUNT" -lt 330 ]; then
            echo "Expected 330 frames but found $FRAME_COUNT."
            exit 1
          fi

      - name: Create transparent animated WebP
        run: |
          mkdir -p assets

          # Render stays black inside Processing so motion blur matches the
          # intended look. Black is converted to alpha only at this final step.
          ffmpeg -y \
            -framerate 30 \
            -start_number 1 \
            -i "$SKETCH_DIR/data/fr%03d.png" \
            -vf "colorkey=0x000000:0.10:0.10,format=rgba,scale=420:420:flags=lanczos" \
            -c:v libwebp_anim \
            -q:v 88 \
            -compression_level 6 \
            -loop 0 \
            -an \
            "assets/binary-rgb-sphere.webp"

          ffprobe \
            -v error \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -of default=noprint_wrappers=1 \
            assets/binary-rgb-sphere.webp

          ls -lh assets/binary-rgb-sphere.webp

      - name: Upload animation artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-rgb-sphere
          path: assets/binary-rgb-sphere.webp
          if-no-files-found: error

      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/binary-rgb-sphere.webp

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Refine Binary RGB Sphere animation"
          git push
